<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>English Tycoon</title><style>*{box-sizing:border-box}body{margin:0;background:#10251f;color:#f6f5e9;font:16px system-ui}main{max-width:850px;margin:auto;padding:20px}h1{color:#ffd477}section{background:#1d3930;border:1px solid #39584b;border-radius:18px;padding:20px;margin:14px 0}button,input{font:inherit;border-radius:10px;padding:12px;margin:5px;border:1px solid #658174}button{background:#ffd477;color:#19271f;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input{max-width:100%;background:#10251f;color:white}label{display:block;padding:10px;background:#29483d;margin:7px 0;border-radius:9px}label input{margin-right:12px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}small{color:#b9d2c5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #456456} .hero{font-size:65px;text-align:center;background:linear-gradient(#305b60,#496d43);border-radius:15px;padding:20px}.money{color:#a5f1b6;font-size:28px;font-weight:bold}.error{color:#ffb4a9} .scroll{overflow:auto}</style><main><h1>💰 English Tycoon</h1><small>Grade 8 • ASAS practice • 3 business levels</small><div id="entry"><section><h2>Join a business</h2><input id="pin" placeholder="Game PIN" inputmode="numeric"><input id="name" placeholder="Student name"><input id="cls" placeholder="Class"><button onclick="join()">Join game</button></section><section><h2>Teacher</h2><button onclick="create()">Create game room</button></section></div><div id="error" class="error"></div><div id="game" hidden><section id="header"></section><section id="controls" hidden></section><section id="question" hidden></section><section id="partner" hidden></section><section id="board"></section><button onclick="leave()">Leave this device session</button></div></main><script>
let session=JSON.parse(localStorage.getItem('tycoon')||'null'),state,shown=null,busy=false,feedbackUntil=0;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){let res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,action,...extra})});let data=await res.json();if(!res.ok)throw Error(data.error);return data}function error(e){$('error').textContent=e.message}async function create(){try{session=await api('create');save()}catch(e){error(e)}}async function join(){try{session=await api('join',{pin:$('pin').value,name:$('name').value,cls:$('cls').value});save()}catch(e){error(e)}}function save(){localStorage.setItem('tycoon',JSON.stringify(session));$('entry').hidden=true;$('game').hidden=false;poll()}function leave(){localStorage.removeItem('tycoon');location.reload()}async function command(action,extra={}){try{await api(action,extra);poll()}catch(e){error(e)}}function start(){command('start',{minutes:[1,2,3].map(i=>Number($('min'+i).value))})}function exportCSV(){let rows=[['Name','Class','Answered','Correct','Money'],...state.students.map(x=>[x.name,x.cls,x.answered,x.correct,x.money])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='english-tycoon-results.csv';a.click();URL.revokeObjectURL(a.href)}
async function poll(){if(!session||busy)return;busy=true;try{state=await api('state');render();$('error').textContent=''}catch(e){error(e)}finally{busy=false}}function render(){let s=state,h=session.role==='host',names=['Street Vendor','Supermarket','Shopping Mall'],icons=['🛒','🏪','🏬'];$('header').innerHTML=`<small>ROOM PIN</small><h2>${esc(s.pin)} · ${s.count} students</h2>${s.status==='lobby'?'Waiting for teacher to start':s.status==='ended'?'<h2>🏆 Game over</h2>':`<div class="hero">${icons[s.round]}</div><h2>Round ${s.round+1} · ${names[s.round]}</h2><b>${Math.floor(s.left/60)}:${String(s.left%60).padStart(2,'0')} remaining · ${esc(s.status)}</b>`}${s.team?`<h3>${esc(s.team)}</h3><div class="money">$${s.money.toLocaleString()}</div><small>Your contribution: $${s.personal}</small>`:''}`;
$('board').innerHTML='<h2>🏆 Leaderboard</h2>'+ (s.ranking.length?'<div class="scroll"><table><tr><th>Rank</th><th>Team</th><th>Money</th><th>Accuracy</th></tr>'+s.ranking.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}<br><small>${x.members.map(esc).join(' & ')}</small></td><td>$${x.money.toLocaleString()}</td><td>${x.accuracy}%</td></tr>`).join('')+'</table></div>':'Teams appear after starting.');
if(h){$('controls').hidden=false;if(s.status==='lobby'){if(!$('min1'))$('controls').innerHTML='<h2>Round minutes</h2>'+[1,2,3].map(i=>`<input id="min${i}" type="number" min="1" max="60" value="10" style="width:80px">`).join('')+'<button onclick="start()">Randomize teams & start</button><p id="roster"></p>';$('roster').textContent=s.students.map(x=>x.name+' ('+x.cls+')').join(', ')}else{$('controls').innerHTML=`<button onclick="command('${s.status==='paused'?'resume':'pause'}')">${s.status==='paused'?'Resume':'Pause'}</button><button onclick="command('next')">Next round</button><button onclick="if(confirm('End game?'))command('end')">End game</button><button onclick="exportCSV()">Export CSV</button><div class="scroll"><table><tr><th>Student</th><th>Answered</th><th>Correct</th><th>Money</th></tr>${s.students.map(x=>`<tr><td>${esc(x.name)} ${x.online?'🟢':'⚪'}</td><td>${x.answered}</td><td>${x.correct}</td><td>$${x.money}</td></tr>`).join('')}</table></div>`}return}
$('partner').hidden=!s.team;if(s.team)$('partner').innerHTML='<h3>Business partners</h3>'+s.partners.map(x=>`<p>${esc(x.name)} ${x.online?'🟢':'⚪'} · $${x.money} · ${esc(x.message)}</p>`).join('')+['Keep going!','Great job!','We can win!','Nice teamwork!'].map(x=>`<button onclick="command('message',{message:this.textContent})">${x}</button>`).join('');$('question').hidden=s.status==='lobby'||s.status==='ended';if($('question').hidden)return;if(s.status==='paused'){$('question').innerHTML='<h2>Game paused</h2>';shown=null;return}if(Date.now()<feedbackUntil)return;let q=s.question;if(!q){shown=null;$('question').innerHTML='<h2>All customers served!</h2><p>Review missed questions while waiting for the next round. No extra money.</p>'+ (s.practice||[]).map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.correct.join(' / '))} — ${esc(x.explanation)}</p></details>`).join('');return}if(shown===q.id){$('reward').textContent='$'+q.reward;return}shown=q.id;$('question').innerHTML=`<small>Customer ${s.answered+1}/20 · $ reward</small><h2 id="reward">$${q.reward}</h2><small>${({M:'Multiple choice',T:'True or false',C:'Select all correct answers',S:'Short answer'})[q.t]}</small><pre>${esc(q.q)}</pre>${q.t==='S'?'<input id="answer" placeholder="Type answer">':q.o.map((o,i)=>`<label><input name="option" type="${q.t==='C'?'checkbox':'radio'}" value="${i}">${esc(o)}</label>`).join('')}<button onclick="answer(false)">Complete sale</button><button onclick="answer(true)">Skip</button>`}
async function answer(skip){if(busy)return;let q=state.question;if(!q)return;let a=q.t==='S'?$('answer').value:[...document.querySelectorAll('input[name=option]:checked')].map(x=>Number(x.value));if(!skip&&!a.length)return;busy=true;try{let x=await api('answer',{id:q.id,answer:a,skip});feedbackUntil=Date.now()+2200;shown=null;$('question').innerHTML=`<h2>${x.ok?'💰 Sale successful! +$'+x.earned:'No income'}</h2><p>${esc(x.correct.join(' / '))}</p><p>${esc(x.explanation)}</p><button onclick="feedbackUntil=0;poll()">Next customer</button>`}catch(e){error(e);shown=null}finally{busy=false}}if(session)save();setInterval(poll,1500);</script></html>
